name: weplan
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - sepal-ui>=2.22.1,<3
  - pyproj
  - matplotlib
  - requests
  - dask
  - wheel
  - gdal=3.8.3
  - pre-commit
  - pip
  - rasterio<=1.4.3
  - rio-tiler
  - pip:
    - git+https://github.com/openforis/earthengine-api.git@v1.1.5rc0#egg=earthengine-api&subdirectory=python
    - git+https://github.com/12rambau/xarray_leaflet.git@single_band_mask#egg=xarray_leaflet